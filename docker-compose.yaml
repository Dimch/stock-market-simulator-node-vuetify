# Development Compose
# - Source code is bind-mounted from the host into both containers.
# - Backend restarts through nodemon when server files change.
# - Frontend runs Vite with --host so it is reachable from the host machine.
# - CHOKIDAR polling is enabled to keep file watching reliable in Docker.
services:
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: stock-simulator-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - stock-simulator-network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: stock-simulator-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_BASE_URL=http://backend:3001
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - stock-simulator-network

  db:
    image: postgres:18-alpine
    container_name: stock-simulator-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=stock_simulator_dev
    ports:
      - "5432:5432"
    volumes:
      - ./packages/backend/database/pg/seed:/docker-entrypoint-initdb.d/
    command: ["postgres", "-c", "log_statement=all"]
    restart: unless-stopped
    networks:
      - stock-simulator-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 30s
      retries: 10
      # start_period: 30s

networks:
  stock-simulator-network:
    driver: bridge
