services:
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT: 3001
    container_name: stock-simulator-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - stock-simulator-network

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_PORT: 3000
    container_name: stock-simulator-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_API_BASE_URL=http://backend:3001
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - stock-simulator-network

networks:
  stock-simulator-network:
    driver: bridge
